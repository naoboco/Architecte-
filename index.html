<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#141414" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ARCHI" />
  <title>ARCHI — Studio d'architecture</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=react3" />
  <style>
    :root{--bg:#f3f0e9;--paper:#fffdf8;--ink:#171717;--muted:#77736b;--line:#d9d4ca;--a:#d8ff53}*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{margin:0;background:radial-gradient(circle at 90% 0,#fff 0,transparent 30%),var(--bg);min-height:100vh}button{font:inherit}.archi-r{min-height:100vh;padding-bottom:90px}.top-r{height:78px;padding:0 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;background:rgba(243,240,233,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.06)}.brand-r{display:flex;gap:10px;align-items:center}.brand-r i{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--a);display:grid;place-items:center;font-style:normal;font-weight:900}.brand-r b{letter-spacing:.16em}.brand-r small{display:block;font-size:9px;color:var(--muted);letter-spacing:.2em}.status-r{display:flex;gap:10px;align-items:center;font-size:12px}.install-r{border:1px solid var(--ink);background:var(--a);border-radius:999px;padding:8px 11px;font-weight:800;cursor:pointer}.install-r:disabled{opacity:.45}.page-r{max-width:1400px;margin:auto;padding:34px 28px 80px}.hero-r{min-height:470px;background:#171717;color:#fff;border-radius:36px;padding:48px;display:grid;grid-template-columns:1.15fr .85fr;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.12)}.hero-r>div:first-child{align-self:center}.hero-r span,.head-r span{font-size:10px;letter-spacing:.18em;font-weight:900;color:#8e8a82}.hero-r span{color:var(--a)}.hero-r h1{font-size:clamp(52px,7vw,96px);line-height:.88;letter-spacing:-.06em;margin:20px 0}.hero-r h1 em{font-style:normal;color:var(--a)}.hero-r p{max-width:560px;color:#c1bfb8;font-size:17px;line-height:1.55}.primary-r,.head-r>button{border:0;border-radius:14px;padding:13px 18px;background:var(--a);font-weight:900;cursor:pointer}.blocks-r{position:relative}.blocks-r i{position:absolute;border:3px solid #171717;background:var(--a);box-shadow:0 30px 70px rgba(0,0,0,.3)}.blocks-r i:nth-child(1){width:240px;height:180px;right:80px;top:60px;transform:skewY(-18deg)}.blocks-r i:nth-child(2){width:160px;height:120px;right:10px;top:135px;background:#fff}.blocks-r i:nth-child(3){width:110px;height:90px;right:210px;top:175px;background:#c7dfe7}.cards-r{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.cards-r article{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;min-height:180px;box-shadow:0 8px 24px rgba(0,0,0,.03)}.cards-r article>b{font-size:11px;color:#aaa59a}.cards-r h3{font-size:24px;margin:42px 0 8px}.cards-r p{color:var(--muted);margin:0}.head-r{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.head-r h1{font-size:48px;letter-spacing:-.05em;margin:5px 0}.head-r p{color:var(--muted);margin:0}.studio-r{display:grid;grid-template-columns:190px 1fr;gap:14px}.studio-r aside,.canvas-r{background:var(--paper);border:1px solid var(--line);border-radius:24px}.studio-r aside{padding:16px;height:max-content;position:sticky;top:100px}.studio-r aside>b{display:block;margin-bottom:10px}.studio-r aside>button,.rot-r button{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;margin:0 0 8px;text-align:left;cursor:pointer}.studio-r hr{border:0;border-top:1px solid var(--line);margin:14px 0}.rot-r{display:grid;grid-template-columns:1fr 1fr;gap:6px}.rot-r button{text-align:center;margin:0}.rot-r button:last-child{grid-column:1/-1}.canvas-r{padding:12px;overflow:hidden}.canvas-r canvas{display:block;width:100%;height:auto;border-radius:16px;touch-action:none;user-select:none}.nav-r{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;background:rgba(23,23,23,.96);padding:8px;border-radius:22px;display:flex;gap:4px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.nav-r button{width:78px;border:0;background:transparent;color:#c9c7c1;border-radius:15px;padding:7px;display:grid;place-items:center;gap:2px;cursor:pointer;font-size:18px}.nav-r small{font-size:9px}.nav-r .on{background:#343832;color:#fff}@media(max-width:850px){.hero-r{grid-template-columns:1fr}.blocks-r{display:none}.cards-r{grid-template-columns:1fr 1fr}.studio-r{grid-template-columns:1fr}.studio-r aside{position:static}.status-r>span{display:none}}@media(max-width:600px){.top-r{padding:0 14px}.page-r{padding:20px 10px 85px}.hero-r{padding:28px 22px;border-radius:26px;min-height:auto}.hero-r h1{font-size:50px}.hero-r p{font-size:14px}.cards-r{grid-template-columns:1fr}.head-r{align-items:start}.head-r h1{font-size:38px}.nav-r{width:calc(100% - 16px);bottom:8px}.nav-r button{width:auto;flex:1}.canvas-r{padding:6px}.install-r{font-size:10px;padding:7px 9px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <script src="./app.js?v=react3"></script>
</body>
</html>
